[project]
name = "langchain-documentation-helper"
version = "0.1.0"
description = "LangChain documentation helper tutorials"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "black>=25.1.0",
    "certifi>=2025.6.15",
    "fastapi>=0.116.0",
    "firecrawl-py>=2.15.0",
    "isort>=6.0.1",
    "jinja2>=3.1.6",
    "langchain>=1.0.0",
    "langchain-chroma>=0.2.4",
    "langchain-community>=0.3.27",
    "langchain-openai>=0.3.29",
    "langchain-pinecone>=0.2.8",
    "langchain-tavily>=0.2.7",
    "langchain-text-splitters>=1.0.0",
    "langchainhub>=0.1.21",
    "langsmith>=0.4.4",
    "nltk>=3.9.1",
    "openai>=1.93.1",
    "pandas>=2.3.1",
    "pillow>=11.3.0",
    "python-dotenv>=1.1.1",
    "rich>=14.0.0",
    "streamlit>=1.46.1",
    "streamlit-chat>=0.1.1",
    "tiktoken>=0.9.0",
    "tqdm>=4.67.0",
    "unstructured>=0.18.3",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = ["ipykernel>=7.0.0a1"]
